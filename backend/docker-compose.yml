services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: truckstop
      POSTGRES_USER: truckstop
      POSTGRES_PASSWORD: truckstop
    ports:
      - "5438:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U truckstop"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgis://truckstop:truckstop@db:5432/truckstop
      SECRET_KEY: django-insecure-dev-only-do-not-use-in-prod
      DEBUG: "True"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
