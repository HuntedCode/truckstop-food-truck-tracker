{% extends "base.html" %}
{% block title %}Log in · Chuckwagon{% endblock %}
{% block content %}
<div class="max-w-md mx-auto">
  <h1 class="font-display text-2xl font-bold mb-6">Welcome back</h1>

  <form method="post" class="space-y-4">
    {% csrf_token %}
    {% include "web/_form_fields.html" %}
    <button class="w-full bg-primary hover:bg-primary-dark text-white font-medium rounded-lg py-2.5 transition-colors">
      Log in
    </button>
  </form>

  <p class="text-sm text-ink-muted mt-4">
    New here? <a href="{% url 'register' %}" class="text-primary underline underline-offset-2">Create an owner account</a>
  </p>
</div>
{% endblock %}
