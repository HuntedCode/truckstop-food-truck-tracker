{% extends "base.html" %}
{% block title %}Sign up · Chuckwagon{% endblock %}
{% block content %}
<div class="max-w-md mx-auto">
  <h1 class="font-display text-2xl font-bold mb-1">Run your truck</h1>
  <p class="text-ink-muted mb-6">Create your owner account to post where you'll be.</p>

  <form method="post" class="space-y-4">
    {% csrf_token %}
    {% include "web/_form_fields.html" %}
    <button class="w-full bg-primary hover:bg-primary-dark text-white font-medium rounded-lg py-2.5 transition-colors">
      Create account
    </button>
  </form>

  <p class="text-sm text-ink-muted mt-4">
    Already have one? <a href="{% url 'login' %}" class="text-primary underline underline-offset-2">Log in</a>
  </p>
</div>
{% endblock %}
