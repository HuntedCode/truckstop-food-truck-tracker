<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Chuckwagon{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&family=Fraunces:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Dev: Tailwind Play CDN with the Warm Street-Food tokens. Production
    // switches to the standalone CLI build (see docs/features/owner-dashboard.md).
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: 'var(--color-primary)', 'primary-dark': 'var(--color-primary-dark)',
            accent: '#F6A623', 'accent-dark': '#D98911', base: '#FCF4E8', surface: '#FFFFFF',
            'wagon-wood': '#6F4A2E', sage: '#7E9466',
            ink: '#2B2118', 'ink-muted': '#6B5D50', border: '#EADFCB',
            'status-here': '#2E7D54', 'status-soon': '#F2A900', 'status-soon-strong': '#8A5300', 'status-away': '#9A8C7D',
            error: '#D7382B',
          },
          fontFamily: {
            sans: ['var(--font-sans)', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            display: ['var(--font-display)', 'ui-sans-serif', 'sans-serif'],
          },
        },
      },
    }
  </script>
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <style>
    :root {
      --color-primary: #E84A27; --color-primary-dark: #C73C1E;
      --font-sans: Inter; --font-display: Poppins;
    }
    input[type=text], input[type=email], input[type=password], input[type=date], input[type=time], input[type=number], select, textarea {
      width: 100%; border: 1px solid #EADFCB; border-radius: 0.5rem;
      padding: 0.5rem 0.75rem; background: #fff; color: #2B2118;
    }
    input:focus, select:focus, textarea:focus {
      outline: 2px solid #F6A623; outline-offset: 1px;
    }
  </style>
</head>
<body class="h-full bg-base text-ink font-sans" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  <header class="bg-surface border-b border-border">
    <div class="mx-auto max-w-3xl px-4 py-3 flex items-center justify-between">
      <a href="{% url 'home' %}" class="font-display text-xl font-bold tracking-tight text-primary">Chuckwagon</a>
      <nav class="text-sm flex items-center gap-4 text-ink-muted">
        {% if user.is_authenticated %}
          <span>{{ user.display_name|default:user.email }}</span>
          <form method="post" action="{% url 'logout' %}" class="inline">
            {% csrf_token %}
            <button class="hover:text-ink">Log out</button>
          </form>
        {% else %}
          <a href="{% url 'login' %}" class="hover:text-ink">Log in</a>
        {% endif %}
      </nav>
    </div>
  </header>

  {% if messages %}
  <div class="mx-auto max-w-3xl px-4 mt-4">
    {% for m in messages %}
      <div class="rounded-lg bg-accent/20 text-ink px-4 py-2 mb-2 text-sm">{{ m }}</div>
    {% endfor %}
  </div>
  {% endif %}

  <main class="mx-auto max-w-3xl px-4 py-6">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
